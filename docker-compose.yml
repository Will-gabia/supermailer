services:
  postgres:
    image: postgres:16-alpine
    container_name: supermailer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supermailer
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supermailer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: supermailer-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: supermailer-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  postfix-local:
    build:
      context: ./infra/postfix
      dockerfile: Dockerfile
    container_name: supermailer-postfix-local
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "2525:25"
    volumes:
      - ./infra/postfix/logs:/var/log/postfix

volumes:
  postgres-data:
